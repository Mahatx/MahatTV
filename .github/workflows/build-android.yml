name: Build Android APK (MahatTV)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'apps/mobile/**'
      - 'package.json'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build UI bundle (Vite) and sync Capacitor Android
        run: npm run mobile:sync

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload MahatTV-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: MahatTV-Android-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
